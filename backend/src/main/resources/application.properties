# ═══════════════════════════════════════════════════════════
#  ReDiscoverU — application.properties
# ═══════════════════════════════════════════════════════════

# ── Database ───────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rediscoveru?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Hikari Connection Pool ─────────────────────────────────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.connection-test-query=SELECT 1

# Hostinger MySQL closes idle connections relatively quickly.
# Keep Hikari connection lifetime below the server wait_timeout.
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.keepalive-time=10000

# ── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Explicitly specify MySQL dialect so Hibernate does not depend
# on JDBC metadata to determine the database dialect.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ReDiscoverU_ChangeInProd_LongSecret_Min32Chars_Jayashankar2024}
jwt.expiration=${JWT_EXPIRY:86400000}

# ── Razorpay ───────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook}

# ── Email — Hostinger SMTP ─────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.test-connection=false

# ── Admin Seed ─────────────────────────────────────────────
admin.email=${ADMIN_EMAIL:admin@rediscoveru.life}
admin.password=${ADMIN_PASSWORD:Admin@2024}
admin.name=${ADMIN_NAME:Jayashankar Lingaiah}

# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=rediscoveru

# ── OTP ────────────────────────────────────────────────────
otp.expiry.minutes=5

# ── File Upload ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

file.upload.dir=${FILE_UPLOAD_DIR:uploads}

# ── App Base URL ───────────────────────────────────────────
app.base.url=${APP_BASE_URL:http://localhost:5500}

# ── Payment Encryption ─────────────────────────────────────
payment.config.encryption.key=${PAYMENT_CONFIG_ENCRYPTION_KEY:ReDiscoverU_PayCfg_SecureKey-2026}

# ── Logging ────────────────────────────────────────────────
logging.level.com.rediscoveru=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.mail=DEBUG

logging.pattern.console=%d{HH:mm:ss} [%-5level] %-25logger{25} - %msg%n
