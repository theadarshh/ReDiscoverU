<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ReDiscoverU</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--bg-2);}
.reset-card{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--radius-lg);padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow-lg);}
.step{display:none;}.step.active{display:block;animation:fadeIn .3s ease;}
.otp-input{text-align:center;letter-spacing:.4em;font-size:1.5rem;font-family:var(--mono);}
</style>
</head>
<body>
<div class="reset-card">
  <a href="login.html" style="font-size:.78rem;color:var(--text-3);display:block;margin-bottom:1.5rem;">← Back to Sign In</a>

  <div class="step active" id="s1">
    <div class="caption">Account Recovery</div>
    <div class="gold-line"></div>
    <h3 style="font-family:var(--serif);font-size:1.8rem;margin-bottom:.25rem;">Reset Password</h3>
    <p style="font-size:.85rem;color:var(--text-3);margin-bottom:1.5rem;">Enter your email and we'll send a 6-digit reset code.</p>
    <div id="a1"></div>
    <div class="form-group"><label>Email Address</label><input type="email" id="fp-email" placeholder="you@example.com"></div>
    <button class="btn btn-gold btn-full" onclick="sendOtp()">Send Reset Code →</button>
  </div>

  <div class="step" id="s2">
    <div class="caption">Verify</div>
    <div class="gold-line"></div>
    <h3 style="font-family:var(--serif);font-size:1.8rem;margin-bottom:.25rem;">Enter Code</h3>
    <p style="font-size:.85rem;color:var(--text-3);margin-bottom:1.5rem;">Check your email for the 6-digit code.</p>
    <div id="a2"></div>
    <div class="form-group"><label>Reset Code</label><input class="otp-input" type="text" id="fp-otp" placeholder="000000" maxlength="6"></div>
    <button class="btn btn-gold btn-full" onclick="verifyCode()">Continue →</button>
  </div>

  <div class="step" id="s3">
    <div class="caption">New Password</div>
    <div class="gold-line"></div>
    <h3 style="font-family:var(--serif);font-size:1.8rem;margin-bottom:.25rem;">Set New Password</h3>
    <p style="font-size:.85rem;color:var(--text-3);margin-bottom:1.5rem;">Choose a strong password.</p>
    <div id="a3"></div>
    <div class="form-group"><label>New Password</label><input type="password" id="new-pw" placeholder="Minimum 8 characters"></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm-pw" placeholder="Repeat password"></div>
    <button class="btn btn-gold btn-full" onclick="resetPw()">Reset Password →</button>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script>
let fpEmail='', fpOtp='';
function goTo(n){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById('s'+n).classList.add('active');}

async function sendOtp(){
  const email=document.getElementById('fp-email').value.trim();
  clearAlert('a1');if(!email){showAlert('a1','Enter your email.');return;}
  try{
    await fetch(`${API}/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    fpEmail=email;showAlert('a1','If that account exists, a reset code was sent.','info');
    setTimeout(()=>goTo(2),1200);
  }catch(e){showAlert('a1','Connection error.');}
}

function verifyCode(){
  fpOtp=document.getElementById('fp-otp').value.trim();
  clearAlert('a2');if(!fpOtp||fpOtp.length!==6){showAlert('a2','Enter the 6-digit code.');return;}
  goTo(3);
}

async function resetPw(){
  const np=document.getElementById('new-pw').value;
  const cp=document.getElementById('confirm-pw').value;
  clearAlert('a3');
  if(!np||np.length<8){showAlert('a3','Password must be at least 8 characters.');return;}
  if(np!==cp){showAlert('a3','Passwords do not match.');return;}
  try{
    const r=await fetch(`${API}/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:fpEmail,otp:fpOtp,newPassword:np})});
    const d=await r.json();
    if(!r.ok){showAlert('a3',d.error||'Reset failed.');return;}
    showAlert('a3','✓ Password reset! Redirecting to sign in…','success');
    setTimeout(()=>location.href='login.html',1800);
  }catch(e){showAlert('a3','Connection error.');}
}
</script>
</body>
</html>
